<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{BRAND_NAME}} - Model 5: 3D Spatial Isometric Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1200px;
      overflow: hidden;
      background-color: #05070D;
      background-image: 
        radial-gradient(circle at 45% 30%, rgba(99, 102, 241, 0.14) 0%, transparent 60%),
        radial-gradient(circle at 80% 60%, rgba(56, 189, 248, 0.12) 0%, transparent 55%),
        radial-gradient(circle at 15% 75%, rgba(168, 85, 247, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #090C16 0%, #030408 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .studio-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 70px 70px;
      pointer-events: none;
      mask-image: radial-gradient(circle at 50% 50%, black 50%, transparent 88%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 50%, transparent 88%);
    }

    .ambient-glow {
      position: absolute;
      width: 1400px;
      height: 600px;
      top: 300px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.10) 0%, rgba(56, 189, 248, 0.06) 50%, transparent 75%);
      filter: blur(90px);
      pointer-events: none;
    }

    /* Top Header Bar */
    .header-bar {
      position: absolute;
      top: 48px;
      left: 68px;
      right: 68px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .brand-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 18px;
      border-radius: 9999px;
      backdrop-filter: blur(12px);
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #818CF8;
      box-shadow: 0 0 10px #818CF8;
    }

    .logo-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: 0.14em;
      font-size: 15px;
      text-transform: uppercase;
      color: #F8FAFC;
    }

    .brand-url {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    .tags-meta {
      display: flex;
      gap: 10px;
    }

    .tag-pill {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #CBD5E1;
      backdrop-filter: blur(8px);
    }

    .tag-pill.accent {
      background: rgba(99, 102, 241, 0.18);
      border-color: rgba(99, 102, 241, 0.45);
      color: #C7D2FE;
    }

    /* ISOMETRIC STAGE */
    .stage {
      position: absolute;
      inset: 0;
      perspective: 1400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .iso-world {
      position: relative;
      width: 1400px;
      height: 750px;
      transform-style: preserve-3d;
      transform: rotateX(24deg) rotateY(-18deg) rotateZ(4deg);
    }

    /* 1. Base Layer: Desktop Storefront */
    .iso-plane-desktop {
      position: absolute;
      top: 60px;
      left: 60px;
      width: 980px;
      height: 590px;
      background: #0F121C;
      border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 40px 90px rgba(0, 0, 0, 0.95),
        0 15px 35px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
      transform: translateZ(0px);
    }

    .iso-header {
      height: 38px;
      background: #141826;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      user-select: none;
    }

    .mac-dots {
      display: flex;
      gap: 7px;
      width: 80px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #EF4444; }
    .dot-yellow { background: #F59E0B; }
    .dot-green { background: #10B981; }

    .iso-url {
      flex: 1;
      max-width: 380px;
      margin: 0 auto;
      height: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      color: #94A3B8;
      font-weight: 500;
    }

    .iso-body {
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .iso-body img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* 2. Mid Layer: Tablet / Catalog Layer (Elevated +60px Z) */
    .iso-plane-tablet {
      position: absolute;
      top: 130px;
      right: 180px;
      width: 480px;
      height: 580px;
      background: #121624;
      border-radius: 28px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      padding: 8px;
      box-shadow: 
        0 45px 100px rgba(0, 0, 0, 0.95),
        0 20px 45px rgba(0, 0, 0, 0.8),
        inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      z-index: 20;
      transform: translateZ(80px);
    }

    .tablet-screen {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
    }

    .tablet-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* 3. Top Layer: Floating Mobile (Elevated +140px Z) */
    .iso-plane-mobile {
      position: absolute;
      bottom: -30px;
      right: 40px;
      width: 300px;
      height: 590px;
      background: #0C0E17;
      border-radius: 46px;
      border: 4px solid #3B4357;
      padding: 8px;
      box-shadow: 
        0 50px 110px rgba(0, 0, 0, 0.98),
        0 25px 50px rgba(0, 0, 0, 0.85),
        inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      z-index: 30;
      transform: translateZ(160px);
    }

    .mobile-screen {
      width: 100%;
      height: 100%;
      border-radius: 38px;
      overflow: hidden;
      background: #000;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .mobile-status {
      height: 32px;
      background: #000;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: relative;
      z-index: 15;
    }

    .mobile-time {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    .mobile-island {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 74px;
      height: 20px;
      background: #000;
      border-radius: 20px;
    }

    .mobile-viewport {
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .mobile-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Floating Badges */
    .iso-badge {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .iso-badge.tablet-b {
      top: -16px;
      right: 24px;
      color: #38BDF8;
      border-color: rgba(56, 189, 248, 0.45);
    }
    .iso-badge.tablet-b::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38BDF8;
      box-shadow: 0 0 8px #38BDF8;
    }

    .iso-badge.mobile-b {
      bottom: -15px;
      left: 20px;
      color: #34D399;
      border-color: rgba(16, 185, 129, 0.45);
    }
    .iso-badge.mobile-b::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
    }

    /* Footer Information Bar */
    .footer-bar {
      position: absolute;
      bottom: 48px;
      left: 68px;
      display: flex;
      align-items: center;
      gap: 28px;
      z-index: 50;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #F1F5F9;
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .footer-divider {
      width: 1px;
      height: 26px;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="studio-grid"></div>
  <div class="ambient-glow"></div>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-meta">
      <div class="logo-badge">
        <span class="logo-dot"></span>
        <span class="logo-title">{{BRAND_NAME}}</span>
      </div>
      <span class="brand-url">{{SITE_URL}}</span>
    </div>

    <div class="tags-meta">
      <div class="tag-pill accent">{{TAG_ACCENT}}</div>
      <div class="tag-pill">{{TAG_2}}</div>
      <div class="tag-pill">{{TAG_3}}</div>
    </div>
  </header>

  <!-- Stage -->
  <main class="stage">
    <div class="iso-world">
      <!-- 1. Base Layer: Desktop Storefront -->
      <div class="iso-plane-desktop">
        <div class="iso-header">
          <div class="mac-dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <div class="iso-url">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            {{SITE_URL}}
          </div>
          <div style="width: 80px;"></div>
        </div>
        <div class="iso-body">
          <img src="{{DESKTOP_IMG_URL}}" alt="{{BRAND_NAME}} Desktop View">
        </div>
      </div>

      <!-- 2. Mid Layer: Tablet / Catalog Layer -->
      <div class="iso-plane-tablet">
        <span class="iso-badge tablet-b">{{TABLET_BADGE}}</span>
        <div class="tablet-screen">
          <img src="{{TABLET_IMG_URL}}" alt="{{BRAND_NAME}} Feature View">
        </div>
      </div>

      <!-- 3. Top Layer: Floating Mobile Device -->
      <div class="iso-plane-mobile">
        <span class="iso-badge mobile-b">{{MOBILE_BADGE}}</span>
        <div class="mobile-screen">
          <div class="mobile-status">
            <span class="mobile-time">9:41</span>
            <div class="mobile-island"></div>
            <div style="width: 14px;"></div>
          </div>
          <div class="mobile-viewport">
            <img src="{{MOBILE_IMG_URL}}" alt="{{BRAND_NAME}} Mobile View">
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Stats -->
  <footer class="footer-bar">
    <div class="stat-item">
      <span class="stat-value">{{STAT_1_VAL}}</span>
      <span class="stat-label">{{STAT_1_LABEL}}</span>
    </div>
    <div class="footer-divider"></div>
    <div class="stat-item">
      <span class="stat-value">{{STAT_2_VAL}}</span>
      <span class="stat-label">{{STAT_2_LABEL}}</span>
    </div>
    <div class="footer-divider"></div>
    <div class="stat-item">
      <span class="stat-value">{{STAT_3_VAL}}</span>
      <span class="stat-label">{{STAT_3_LABEL}}</span>
    </div>
  </footer>
</body>
</html>
